openapi: 3.0.0
info:
  title: Event Planner API
  version: 1.0.0
  description: API for managing venues, events, and tickets.

servers:
  - url: http://localhost:3000
    description: Local server

tags:
  - name: Auth
  - name: Venues
  - name: Events
  - name: Tickets

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

paths:
  /:
    get:
      summary: Health check
      tags: [Monitoring]
      responses:
        '200':
          description: API is running

  /api/auth/signup:
    post:
      summary: Create new user account
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            example:
              username: testuser
              email: test@example.com
              password: Password123!
      responses:
        '201':
          description: User created
        '400':
          description: Missing fields
        '409':
          description: Email already used

  /api/auth/login:
    post:
      summary: Login user
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            example:
              email: user@example.com
              password: Password123!
      responses:
        '200':
          description: Login successful
        '400':
          description: Missing fields
        '401':
          description: Invalid credentials

  /api/venues:
    get:
      summary: Get all venues
      tags: [Venues]
      responses:
        '200':
          description: Success
    post:
      summary: Create a venue
      tags: [Venues]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: My Venue
              address: Charlotte
              capacity: 100
      responses:
        '201':
          description: Venue created
        '400':
          description: Missing fields
        '401':
          description: Unauthorized

  /api/venues/{id}:
    get:
      summary: Get venue by ID
      tags: [Venues]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Success
        '400':
          description: Invalid venue id
        '404':
          description: Venue not found
    put:
      summary: Update venue by ID
      tags: [Venues]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              name: Updated Venue
              address: Charlotte
              capacity: 200
      responses:
        '200':
          description: Venue updated
        '400':
          description: Invalid id or missing fields
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Venue not found
    delete:
      summary: Delete venue by ID
      tags: [Venues]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Venue deleted
        '400':
          description: Invalid venue id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Venue not found

  /api/events:
    get:
      summary: Get all events
      tags: [Events]
      responses:
        '200':
          description: Success
    post:
      summary: Create an event
      tags: [Events]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              title: Networking Night
              description: Campus event
              eventDate: 2026-05-01T00:00:00.000Z
              venueId: 1
      responses:
        '201':
          description: Event created
        '400':
          description: Missing fields
        '401':
          description: Unauthorized
        '404':
          description: Venue not found

  /api/events/{id}:
    get:
      summary: Get event by ID
      tags: [Events]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Success
        '400':
          description: Invalid event id
        '404':
          description: Event not found
    put:
      summary: Update event by ID
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              title: Updated Event
              description: Updated description
              eventDate: 2026-06-01T00:00:00.000Z
              venueId: 1
      responses:
        '200':
          description: Event updated
        '400':
          description: Invalid id or missing fields
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Event or venue not found
        '409':
          description: Event conflict
    delete:
      summary: Delete event by ID
      tags: [Events]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Event deleted
        '400':
          description: Invalid event id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Event not found

  /api/tickets:
    get:
      summary: Get all tickets
      description: Admin only
      tags: [Tickets]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Success
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      summary: Create a ticket
      tags: [Tickets]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            example:
              price: 20
              status: PURCHASED
              eventId: 1
      responses:
        '201':
          description: Ticket created
        '400':
          description: Missing fields
        '401':
          description: Unauthorized
        '404':
          description: Event not found
        '409':
          description: Ticket already exists

  /api/tickets/{id}:
    get:
      summary: Get ticket by ID
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Success
        '400':
          description: Invalid ticket id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Ticket not found
    put:
      summary: Update ticket by ID
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            example:
              price: 35
              status: CONFIRMED
      responses:
        '200':
          description: Ticket updated
        '400':
          description: Invalid id or missing fields
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Ticket not found
    delete:
      summary: Delete ticket by ID
      tags: [Tickets]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: Ticket deleted
        '400':
          description: Invalid ticket id
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Ticket not found